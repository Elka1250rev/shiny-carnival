name: Pubblica su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
